name: Mevzuat RAG Testi

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
      - name: JavaScript sözdizimini denetle
        run: |
          node --check mevzuat-rag.js
          node --check turkce-eslesme.js
          node --check rehber.js
      - name: Yayın enjeksiyonunu denetle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          tags = ['<script src="rehber.js?v=5"></script>']
          assert '</body>' in html
          assert Path('rehber.js').exists()
          for tag in tags:
              assert html.count(tag) == 1
          print('PASS')
          PY
