name: Tiyatro Teknik El Kitabını Yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6

      - name: Site kaynağını ilk kez taşı
        shell: bash
        run: |
          if [ ! -f index.html ]; then
            curl --fail --location \
              https://raw.githubusercontent.com/HermesMurat/tiyatro-takip/main/teknik-el-kitabi/index.html \
              --output index.html
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Site kaynağını ayrı depoya taşı [skip ci]"
            git push
          fi

      - name: Yayın klasörünü hazırla
        run: |
          mkdir -p public
          cp index.html public/index.html
          touch public/.nojekyll

      - name: GitHub Pages yapılandırması
        uses: actions/configure-pages@v5

      - name: Site paketini yükle
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
