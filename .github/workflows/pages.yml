name: Tiyatro Teknik El Kitabını Yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6

      - name: Pages durumunu denetle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages"
          get_code=$(curl -sS -o pages-get.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" "$api")
          {
            echo "GET=$get_code"
            echo "POST=not-needed"
            echo "RUN=${GITHUB_RUN_ID}"
          } > .pages-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pages-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Pages durumunu kaydet [skip ci]"
            git push
          fi

      - name: Tam metinli siteyi derle
        run: bash scripts/build-site.sh

      - name: GitHub Pages yapılandırması
        uses: actions/configure-pages@v5

      - name: Site paketini yükle
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
