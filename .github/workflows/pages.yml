name: Tiyatro Teknik El Kitabını Yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6

      - name: Pages durumunu denetle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages"
          get_code=$(curl -sS -o pages-get.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" "$api")
          {
            echo "GET=$get_code"
            echo "POST=not-needed"
            echo "RUN=${GITHUB_RUN_ID}"
          } > .pages-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .pages-status.txt
          if ! git diff --cached --quiet; then
            git commit -m "Pages durumunu kaydet [skip ci]"
            git push
          fi

      - name: Dijital kitap paketini aç
        run: |
          cat content-pack/chapters.part.* | base64 --decode > /tmp/chapters-preview.tar.gz
          echo "4c22b719a6e6356cb6baba8f19a5a19d2bc1d38d97ec452fdd112f2f62bb2295  /tmp/chapters-preview.tar.gz" | sha256sum --check
          mkdir -p public/chapters
          tar -xzf /tmp/chapters-preview.tar.gz -C public/chapters

      - name: Yayın klasörünü hazırla
        run: |
          cp index.html public/index.html
          cp chapter.html public/chapter.html
          cp mevzuat-rag.js public/mevzuat-rag.js
          cp turkce-eslesme.js public/turkce-eslesme.js
          cp web-research.js public/web-research.js
          touch public/.nojekyll

      - name: Yayın paketini denetle
        run: |
          test -f public/index.html
          test -f public/chapter.html
          test -f public/chapters/index.json
          test "$(find public/chapters -maxdepth 1 -name '[0-9][0-9].json' | wc -l)" -eq 24
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path('public/chapters').glob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          print('24 bölüm verisi ve dizin doğrulandı')
          PY
          node --check public/mevzuat-rag.js
          node --check public/turkce-eslesme.js
          node --check public/web-research.js

      - name: GitHub Pages yapılandırması
        uses: actions/configure-pages@v5

      - name: Site paketini yükle
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
