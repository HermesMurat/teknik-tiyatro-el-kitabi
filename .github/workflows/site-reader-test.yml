name: Bölüm Okuyucu ve Araştırma Testi

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
      - name: Bölüm paketini aç
        run: |
          cat \
            content-pack/chapters.part.00 \
            content-pack/chapters.part.01 \
            content-pack/chapters.part.02fix.00 \
            content-pack/chapters.part.02fix.01 \
            content-pack/chapters.part.02fix.02 \
            content-pack/chapters.part.02fix.03 \
            content-pack/chapters.part.03 \
            content-pack/chapters.part.04 \
            | base64 --decode > /tmp/chapters-preview.tar.gz
          echo "1e543a97d5da8ebd02f1be64cc2be8adb5c2937f414c72b27b14869cc24fdc35  /tmp/chapters-preview.tar.gz" | sha256sum --check
          mkdir -p /tmp/chapters
          tar -xzf /tmp/chapters-preview.tar.gz -C /tmp/chapters
      - name: Bölümleri doğrula
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/chapters')
          index = json.loads((root / 'index.json').read_text(encoding='utf-8'))
          assert len(index) == 24
          for number in range(1, 25):
              data = json.loads((root / f'{number:02}.json').read_text(encoding='utf-8'))
              assert data['number'] == number
              assert data['title']
              assert data['sections']
              assert all(section.get('blocks') for section in data['sections'])
          assert sum(item['wordCount'] for item in index) > 100000
          hits = []
          allowed = {'teftis.ktb.gov.tr', 'devtiyatro.gov.tr'}
          for number in range(1, 25):
              data = json.loads((root / f'{number:02}.json').read_text(encoding='utf-8'))
              for section_index, section in enumerate(data['sections']):
                  text = json.dumps(section, ensure_ascii=False).lower()
                  if 'dekoratör' in text:
                      hits.append((number, section_index))
                  for block in section.get('blocks', []):
                      if block.get('type') == 'source':
                          from urllib.parse import urlparse
                          assert urlparse(block['url']).hostname in allowed
                          assert 'Devlet Tiyatroları' in block['title']
          assert hits, 'dekoratör için tam metin sonucu bulunamadı'
          print(f'dekoratör için {len(hits)} doğrudan bölüm sonucu doğrulandı')
          print('24 bölüm ve eksiksiz içerik doğrulandı')
          PY
      - name: Web dosyalarını doğrula
        run: |
          test -f index.html
          test -f chapter.html
          test -f arama.js
          test -f rehber.js
          grep -q 'Bölümü aç ve oku' index.html
          grep -q 'searchAllContent' index.html
          grep -q 'chapters/' chapter.html
          grep -q 'El kitabı + DT kaynakları' index.html
          grep -q 'Bu kısmı sor' chapter.html
          grep -q 'Tüm yazıları göster' chapter.html
          node --check arama.js
          node tests/arama-unit.js
          node --check rehber.js
